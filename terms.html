  <h1>利用規約</h1>
  <p>最終更新日: 2026年11月1日</p>
  <h2>目的</h2>
  <p>本ツールは、利用者本人が管理するSNSアカウントへの投稿と実績確認を補助する目的で提供されます。</p>
  <h2>利用条件</h2>
  <p>利用者は、各SNSおよびGoogleが定める規約を遵守し、自身が管理権限を持つアカウントにのみ本ツールを利用します。</p>
  <h2>禁止事項</h2>
  <p>第三者の権利を侵害する投稿、不正アクセス、認証情報の不正利用、各サービスの規約に反する利用を禁止します。</p>
  <h2>変更と停止</h2>
  <p>安全性の確保、仕様変更、または外部サービスの変更に応じて、本ツールの機能を変更または停止する場合があります。</p>
